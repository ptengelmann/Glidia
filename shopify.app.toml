# shopify.app.toml
# Learn more: https://shopify.dev/docs/apps/tools/cli/configuration

name = "glidia-care"
client_id = "5575757e5b7ffbd0358890176680851e"
application_url = "https://your-production-domain.com"
embedded = true

[access_scopes]
scopes = "read_orders,read_products,read_customers,write_orders"

[auth]
redirect_urls = [
  "https://your-production-domain.com/api/auth/shopify/callback",
  "http://localhost:3000/api/auth/shopify/callback"
]

[webhooks]
api_version = "2024-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/api/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "orders/paid" ]
  uri = "/api/webhooks/orders/paid"

  [[webhooks.subscriptions]]
  topics = [ "orders/fulfilled" ]
  uri = "/api/webhooks/orders/fulfilled"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = true
dev_store_url = "https://glidiatest.myshopify.com"