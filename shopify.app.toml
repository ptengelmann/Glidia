# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "5575757e5b7ffbd035889017668d051e"
name = "glidia-care"
handle = "glidia"
application_url = "https://glidia.vercel.app"
embedded = false

[build]
automatically_update_urls_on_dev = true
dev_store_url = "glidiatest.myshopify.com"
include_config_on_deploy = true

[webhooks]
api_version = "2024-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/api/webhooks/app/uninstalled"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,read_products,write_orders"

[auth]
redirect_urls = [
  "https://glidia.vercel.app/api/auth/shopify/callback",
  "http://localhost:3000/api/auth/shopify/callback"
]

[pos]
embedded = false
